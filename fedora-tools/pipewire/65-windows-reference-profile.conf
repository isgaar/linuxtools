# Configuración PipeWire equivalente a la salida de referencia medida en Windows
# Basado en la caracterización acústica objetiva black-box en este host (Realtek ALC623).
# Entrega la señal lineal, neutra, pura y con aislamiento 100% L/R (sin curva de ecualización
# de estudio ni crossfeed binaural).

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Audio Referencia Neutro Windows"
            media.name       = "Audio Referencia Neutro Windows"
            filter.graph = {
                nodes = [
                    # Duplicadores lineales directos
                    { type = builtin label = copy name = inL }
                    { type = builtin label = copy name = inR }

                    # Mezcladores con ganancia unitaria 1.0 (0.0 dB) y 0% diafonía
                    { type = builtin label = mixer name = mixL control = { "Gain 1" = 1.0 } }
                    { type = builtin label = mixer name = mixR control = { "Gain 1" = 1.0 } }
                ]
                links = [
                    { output = "inL:Out" input = "mixL:In 1" }
                    { output = "inR:Out" input = "mixR:In 1" }
                ]
                inputs  = [ "inL:In" "inR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name      = "windows_reference_sink"
                media.class    = Audio/Sink
                priority.session = 1000
                priority.driver  = 1000
            }
            playback.props = {
                node.name      = "windows_reference_playback"
                node.passive   = true
            }
        }
    }
]
