# Routing automático y protección de ganancia unitaria en PipeWire / PulseAudio:
# 1. hifi_loss_sink permanece siempre a 0 dB (ganancia unitaria) para evitar atenuación fantasma
# 2. Todo flujo de reproducción se procesa a través del filtro maestro hifi-loss
pulse.rules = [
    {
        matches = [
            {
                node.name = "hifi_loss_sink"
            }
        ]
        actions = {
            quirks = [ block-sink-volume ]
        }
    },
    {
        matches = [
            {
                media.class = "Stream/Output/Audio"
                node.name   = "!~hifi_loss.*"
            }
        ]
        actions = {
            update-props = {
                target.object = "hifi_loss_sink"
            }
        }
    }
]
