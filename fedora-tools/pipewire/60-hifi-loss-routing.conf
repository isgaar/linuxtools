# Routing automático de flujos hacia hifi_loss_sink en PipeWire
stream.rules = [
    {
        matches = [
            {
                media.class = "Stream/Output/Audio"
                node.name   = "!~hifi_loss.*"
            }
        ]
        actions = {
            update-props = {
                target.object = "hifi_loss_sink"
            }
        }
    }
]
