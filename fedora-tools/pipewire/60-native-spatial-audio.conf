# Configuración Nativa de Audio Espacial para PipeWire (Sin Intermediarios)
# Generado para emular la espacialidad tridimensional (Dolby Atmos / HRIR / macOS)
# directamente en el hilo de tiempo real de PipeWire mediante libpipewire-module-filter-chain.

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Audio Espacial Nativo (Dolby Atmos HRIR)"
            media.name       = "Audio Espacial Nativo (Dolby Atmos HRIR)"
            filter.graph = {
                nodes = [
                    # 1. Duplicadores de señal de entrada
                    { type = builtin label = copy name = inL }
                    { type = builtin label = copy name = inR }

                    # 2. Cadena de ecualización paramétrica biquad (Curva Difusa / Anti-Mud)
                    # Canal Izquierdo
                    { type = builtin label = bq_lowshelf  name = eq_low_L    control = { "Freq" = 35.0   "Q" = 0.8 "Gain" = 3.0 } }
                    { type = builtin label = bq_peaking   name = eq_box1_L   control = { "Freq" = 250.0  "Q" = 1.3 "Gain" = -2.5 } }
                    { type = builtin label = bq_peaking   name = eq_box2_L   control = { "Freq" = 500.0  "Q" = 1.3 "Gain" = -1.5 } }
                    { type = builtin label = bq_peaking   name = eq_pres_L   control = { "Freq" = 2000.0 "Q" = 1.2 "Gain" = 1.8 } }
                    { type = builtin label = bq_highshelf name = eq_air_L    control = { "Freq" = 10000.0 "Q" = 0.8 "Gain" = 3.5 } }

                    # Canal Derecho
                    { type = builtin label = bq_lowshelf  name = eq_low_R    control = { "Freq" = 35.0   "Q" = 0.8 "Gain" = 3.0 } }
                    { type = builtin label = bq_peaking   name = eq_box1_R   control = { "Freq" = 250.0  "Q" = 1.3 "Gain" = -2.5 } }
                    { type = builtin label = bq_peaking   name = eq_box2_R   control = { "Freq" = 500.0  "Q" = 1.3 "Gain" = -1.5 } }
                    { type = builtin label = bq_peaking   name = eq_pres_R   control = { "Freq" = 2000.0 "Q" = 1.2 "Gain" = 1.8 } }
                    { type = builtin label = bq_highshelf name = eq_air_R    control = { "Freq" = 10000.0 "Q" = 0.8 "Gain" = 3.5 } }

                    # 3. Matriz de Convolución Acústica HRIR (Dolby Atmos)
                    # Oído directo izquierdo (L -> L)
                    { type = builtin label = convolver name = conv_LL config = { filename = "@HRIR_PATH@" channel = 0 gain = 0.60 } }
                    # Oído cruzado / crossfeed interaural izquierdo a derecho (L -> R)
                    { type = builtin label = convolver name = conv_LR config = { filename = "@HRIR_PATH@" channel = 1 gain = 0.15 } }
                    # Oído directo derecho (R -> R)
                    { type = builtin label = convolver name = conv_RR config = { filename = "@HRIR_PATH@" channel = 0 gain = 0.60 } }
                    # Oído cruzado / crossfeed interaural derecho a izquierdo (R -> L)
                    { type = builtin label = convolver name = conv_RL config = { filename = "@HRIR_PATH@" channel = 1 gain = 0.15 } }

                    # 4. Mezcladores estéreo de salida binaural
                    { type = builtin label = mixer name = mixL }
                    { type = builtin label = mixer name = mixR }
                ]
                links = [
                    # Enlaces EQ Canal Izquierdo
                    { output = "inL:Out"          input = "eq_low_L:In" }
                    { output = "eq_low_L:Out"     input = "eq_box1_L:In" }
                    { output = "eq_box1_L:Out"    input = "eq_box2_L:In" }
                    { output = "eq_box2_L:Out"    input = "eq_pres_L:In" }
                    { output = "eq_pres_L:Out"    input = "eq_air_L:In" }

                    # Enlaces EQ Canal Derecho
                    { output = "inR:Out"          input = "eq_low_R:In" }
                    { output = "eq_low_R:Out"     input = "eq_box1_R:In" }
                    { output = "eq_box1_R:Out"    input = "eq_box2_R:In" }
                    { output = "eq_box2_R:Out"    input = "eq_pres_R:In" }
                    { output = "eq_pres_R:Out"    input = "eq_air_R:In" }

                    # Enrutamiento hacia Convolución HRIR
                    { output = "eq_air_L:Out"     input = "conv_LL:In" }
                    { output = "eq_air_L:Out"     input = "conv_LR:In" }
                    { output = "eq_air_R:Out"     input = "conv_RR:In" }
                    { output = "eq_air_R:Out"     input = "conv_RL:In" }

                    # Mezcla de señales directas y de crossfeed
                    { output = "conv_LL:Out"      input = "mixL:In 1" }
                    { output = "conv_RL:Out"      input = "mixL:In 2" }

                    { output = "conv_RR:Out"      input = "mixR:In 1" }
                    { output = "conv_LR:Out"      input = "mixR:In 2" }
                ]
                inputs  = [ "inL:In" "inR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name      = "spatial_audio_sink"
                media.class    = Audio/Sink
                priority.session = 1000
                priority.driver  = 1000
            }
            playback.props = {
                node.name      = "spatial_audio_playback"
                node.passive   = true
            }
        }
    }
]
