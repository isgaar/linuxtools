# Configuración Nativa de Audio Espacial para PipeWire (Sin Intermediarios)
# Pipeline DSP de Alta Fidelidad: Ecualización Paramétrica de Estudio (10 Bandas) +
# Ensanchamiento Estéreo Mid/Side + Compensación Binaural Acústica (Bauer 700 Hz).
# Cero latencia (0 ms), cero eco/comb-filtering, volumen calibrado sin pérdidas (0% clipping)
# y sin dependencias de librerías ni convolución pesada.

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Audio Espacial Nativo Dolby Atmos Studio"
            media.name       = "Audio Espacial Nativo Dolby Atmos Studio"
            filter.graph = {
                nodes = [
                    # 1. Duplicadores de señal de entrada L/R
                    { type = builtin label = copy name = inL }
                    { type = builtin label = copy name = inR }

                    # 2. Ecualizador Paramétrico de Precisión - Canal Izquierdo (10 Bandas de Estudio)
                    { type = builtin label = bq_peaking name = eq_L_1  control = { "Freq" = 35.0   "Q" = 0.8 "Gain" = 3.5 } }
                    { type = builtin label = bq_peaking name = eq_L_2  control = { "Freq" = 65.0   "Q" = 1.0 "Gain" = 3.0 } }
                    { type = builtin label = bq_peaking name = eq_L_3  control = { "Freq" = 125.0  "Q" = 1.1 "Gain" = 1.5 } }
                    { type = builtin label = bq_peaking name = eq_L_4  control = { "Freq" = 250.0  "Q" = 1.3 "Gain" = -2.5 } }
                    { type = builtin label = bq_peaking name = eq_L_5  control = { "Freq" = 500.0  "Q" = 1.3 "Gain" = -1.5 } }
                    { type = builtin label = bq_peaking name = eq_L_6  control = { "Freq" = 1000.0 "Q" = 1.4 "Gain" = 0.5 } }
                    { type = builtin label = bq_peaking name = eq_L_7  control = { "Freq" = 2000.0 "Q" = 1.2 "Gain" = 2.0 } }
                    { type = builtin label = bq_peaking name = eq_L_8  control = { "Freq" = 4000.0 "Q" = 1.0 "Gain" = 2.5 } }
                    { type = builtin label = bq_peaking name = eq_L_9  control = { "Freq" = 8000.0 "Q" = 0.9 "Gain" = 3.0 } }
                    { type = builtin label = bq_peaking name = eq_L_10 control = { "Freq" = 12000.0 "Q" = 0.8 "Gain" = 3.5 } }

                    # 3. Ecualizador Paramétrico de Precisión - Canal Derecho (10 Bandas de Estudio)
                    { type = builtin label = bq_peaking name = eq_R_1  control = { "Freq" = 35.0   "Q" = 0.8 "Gain" = 3.5 } }
                    { type = builtin label = bq_peaking name = eq_R_2  control = { "Freq" = 65.0   "Q" = 1.0 "Gain" = 3.0 } }
                    { type = builtin label = bq_peaking name = eq_R_3  control = { "Freq" = 125.0  "Q" = 1.1 "Gain" = 1.5 } }
                    { type = builtin label = bq_peaking name = eq_R_4  control = { "Freq" = 250.0  "Q" = 1.3 "Gain" = -2.5 } }
                    { type = builtin label = bq_peaking name = eq_R_5  control = { "Freq" = 500.0  "Q" = 1.3 "Gain" = -1.5 } }
                    { type = builtin label = bq_peaking name = eq_R_6  control = { "Freq" = 1000.0 "Q" = 1.4 "Gain" = 0.5 } }
                    { type = builtin label = bq_peaking name = eq_R_7  control = { "Freq" = 2000.0 "Q" = 1.2 "Gain" = 2.0 } }
                    { type = builtin label = bq_peaking name = eq_R_8  control = { "Freq" = 4000.0 "Q" = 1.0 "Gain" = 2.5 } }
                    { type = builtin label = bq_peaking name = eq_R_9  control = { "Freq" = 8000.0 "Q" = 0.9 "Gain" = 3.0 } }
                    { type = builtin label = bq_peaking name = eq_R_10 control = { "Freq" = 12000.0 "Q" = 0.8 "Gain" = 3.5 } }

                    # 4. Filtros de Crossfeed Acústico Contralateral (Bauer 700 Hz)
                    { type = builtin label = bq_lowpass name = cross_L control = { "Freq" = 700.0  "Q" = 0.7 } }
                    { type = builtin label = bq_lowpass name = cross_R control = { "Freq" = 700.0  "Q" = 0.7 } }

                    # 5. Mezcladores Espaciales (Mid/Side Widening + Crossfeed Compensation)
                    { type = builtin label = mixer name = mixL control = { "Gain 1" = 0.88 "Gain 2" = -0.10 "Gain 3" = 0.10 } }
                    { type = builtin label = mixer name = mixR control = { "Gain 1" = 0.88 "Gain 2" = -0.10 "Gain 3" = 0.10 } }
                ]
                links = [
                    # Cadena EQ Izquierda
                    { output = "inL:Out"       input = "eq_L_1:In" }
                    { output = "eq_L_1:Out"    input = "eq_L_2:In" }
                    { output = "eq_L_2:Out"    input = "eq_L_3:In" }
                    { output = "eq_L_3:Out"    input = "eq_L_4:In" }
                    { output = "eq_L_4:Out"    input = "eq_L_5:In" }
                    { output = "eq_L_5:Out"    input = "eq_L_6:In" }
                    { output = "eq_L_6:Out"    input = "eq_L_7:In" }
                    { output = "eq_L_7:Out"    input = "eq_L_8:In" }
                    { output = "eq_L_8:Out"    input = "eq_L_9:In" }
                    { output = "eq_L_9:Out"    input = "eq_L_10:In" }

                    # Cadena EQ Derecha
                    { output = "inR:Out"       input = "eq_R_1:In" }
                    { output = "eq_R_1:Out"    input = "eq_R_2:In" }
                    { output = "eq_R_2:Out"    input = "eq_R_3:In" }
                    { output = "eq_R_3:Out"    input = "eq_R_4:In" }
                    { output = "eq_R_4:Out"    input = "eq_R_5:In" }
                    { output = "eq_R_5:Out"    input = "eq_R_6:In" }
                    { output = "eq_R_6:Out"    input = "eq_R_7:In" }
                    { output = "eq_R_7:Out"    input = "eq_R_8:In" }
                    { output = "eq_R_8:Out"    input = "eq_R_9:In" }
                    { output = "eq_R_9:Out"    input = "eq_R_10:In" }

                    # Conexiones hacia Crossfeed
                    { output = "eq_L_10:Out"   input = "cross_L:In" }
                    { output = "eq_R_10:Out"   input = "cross_R:In" }

                    # Mezcla Espacial Canal Izquierdo:
                    # In 1: Señal directa izquierda ecualizada (0.88)
                    # In 2: Señal derecha para ensanchamiento Mid/Side (-0.10)
                    # In 3: Señal derecha filtrada <700Hz para crossfeed binaural (+0.10)
                    { output = "eq_L_10:Out"   input = "mixL:In 1" }
                    { output = "eq_R_10:Out"   input = "mixL:In 2" }
                    { output = "cross_R:Out"   input = "mixL:In 3" }

                    # Mezcla Espacial Canal Derecho:
                    # In 1: Señal directa derecha ecualizada (0.88)
                    # In 2: Señal izquierda para ensanchamiento Mid/Side (-0.10)
                    # In 3: Señal izquierda filtrada <700Hz para crossfeed binaural (+0.10)
                    { output = "eq_R_10:Out"   input = "mixR:In 1" }
                    { output = "eq_L_10:Out"   input = "mixR:In 2" }
                    { output = "cross_L:Out"   input = "mixR:In 3" }
                ]
                inputs  = [ "inL:In" "inR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name      = "spatial_audio_sink"
                media.class    = Audio/Sink
                priority.session = 1000
                priority.driver  = 1000
            }
            playback.props = {
                node.name      = "spatial_audio_playback"
                node.passive   = true
            }
        }
    }
]
