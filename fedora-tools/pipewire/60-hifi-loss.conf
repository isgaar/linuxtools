# ==============================================================================
# Perfil Maestro PipeWire: "hifi-loss" (Hi-Fi Lossless Studio Master)
# ==============================================================================
# Fusión acústica integral que supera la salida de referencia de Windows:
#  1. Fidelidad Bit-Perfect & Cero Latencia (0 ms): Procesamiento nativo en C/SPA
#     dentro del hilo de tiempo real de PipeWire, sin intermediarios destructivos.
#  2. Margen de Seguridad True-Peak (-0.14 dBFS / 0.984 lineal): Heredado de la
#     medición acústica de Windows para erradicar el clipping inter-muestra en el DAC.
#  3. Filtro Pasa-Altos Subsónico Butterworth 25 Hz (Q=0.707): Protege los
#     altavoces internos (NID 0x17) y auriculares de la sobre-excursión mecánica e IMD.
#  4. Curva de Estudio Audiófila de 10 Bandas: Síntesis de Harman Target, Fletcher-Munson,
#     Apple Spatial Audio y Perfect EQ (bajos profundos, corte anti-caja en 250 Hz,
#     presencia vocal frontal y apertura aérea en 14 kHz).
#  5. Espacialización Tridimensional Lossless: Matriz Mid/Side (+16% soundstage) y
#     compensación binaural Bauer a 700 Hz para eliminar la fatiga auditiva.
# ==============================================================================

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Hi-Fi Lossless Master (hifi-loss)"
            media.name       = "Hi-Fi Lossless Master (hifi-loss)"
            filter.graph = {
                nodes = [
                    # 1. Duplicadores lineales directos de entrada L/R
                    { type = builtin label = copy name = inL }
                    { type = builtin label = copy name = inR }

                    # 2. Filtro Pasa-Altos Subsónico Butterworth 25 Hz (Protección acústica contra sobre-excursión)
                    { type = builtin label = bq_highpass name = hp_L control = { "Freq" = 25.0 "Q" = 0.7071 } }
                    { type = builtin label = bq_highpass name = hp_R control = { "Freq" = 25.0 "Q" = 0.7071 } }

                    # 3. Cadena de Ecualización Paramétrica Audiófila (Canal Izquierdo - 10 Bandas)
                    { type = builtin label = bq_peaking name = eq_L_1  control = { "Freq" = 32.0   "Q" = 1.0  "Gain" = 2.8 } }
                    { type = builtin label = bq_peaking name = eq_L_2  control = { "Freq" = 64.0   "Q" = 1.1  "Gain" = 2.4 } }
                    { type = builtin label = bq_peaking name = eq_L_3  control = { "Freq" = 125.0  "Q" = 1.2  "Gain" = 1.0 } }
                    { type = builtin label = bq_peaking name = eq_L_4  control = { "Freq" = 250.0  "Q" = 1.4  "Gain" = -2.2 } }
                    { type = builtin label = bq_peaking name = eq_L_5  control = { "Freq" = 500.0  "Q" = 1.4  "Gain" = -1.2 } }
                    { type = builtin label = bq_peaking name = eq_L_6  control = { "Freq" = 1000.0 "Q" = 1.4  "Gain" = 0.6 } }
                    { type = builtin label = bq_peaking name = eq_L_7  control = { "Freq" = 2000.0 "Q" = 1.2  "Gain" = 1.8 } }
                    { type = builtin label = bq_peaking name = eq_L_8  control = { "Freq" = 4000.0 "Q" = 1.1  "Gain" = 2.2 } }
                    { type = builtin label = bq_peaking name = eq_L_9  control = { "Freq" = 8000.0 "Q" = 1.0  "Gain" = 2.8 } }
                    { type = builtin label = bq_peaking name = eq_L_10 control = { "Freq" = 14000.0 "Q" = 0.8 "Gain" = 3.6 } }

                    # 4. Cadena de Ecualización Paramétrica Audiófila (Canal Derecho - 10 Bandas)
                    { type = builtin label = bq_peaking name = eq_R_1  control = { "Freq" = 32.0   "Q" = 1.0  "Gain" = 2.8 } }
                    { type = builtin label = bq_peaking name = eq_R_2  control = { "Freq" = 64.0   "Q" = 1.1  "Gain" = 2.4 } }
                    { type = builtin label = bq_peaking name = eq_R_3  control = { "Freq" = 125.0  "Q" = 1.2  "Gain" = 1.0 } }
                    { type = builtin label = bq_peaking name = eq_R_4  control = { "Freq" = 250.0  "Q" = 1.4  "Gain" = -2.2 } }
                    { type = builtin label = bq_peaking name = eq_R_5  control = { "Freq" = 500.0  "Q" = 1.4  "Gain" = -1.2 } }
                    { type = builtin label = bq_peaking name = eq_R_6  control = { "Freq" = 1000.0 "Q" = 1.4  "Gain" = 0.6 } }
                    { type = builtin label = bq_peaking name = eq_R_7  control = { "Freq" = 2000.0 "Q" = 1.2  "Gain" = 1.8 } }
                    { type = builtin label = bq_peaking name = eq_R_8  control = { "Freq" = 4000.0 "Q" = 1.1  "Gain" = 2.2 } }
                    { type = builtin label = bq_peaking name = eq_R_9  control = { "Freq" = 8000.0 "Q" = 1.0  "Gain" = 2.8 } }
                    { type = builtin label = bq_peaking name = eq_R_10 control = { "Freq" = 14000.0 "Q" = 0.8 "Gain" = 3.6 } }

                    # 5. Filtros de Crossfeed Acústico Binaural Contralateral (Bauer 700 Hz)
                    { type = builtin label = bq_lowpass name = cross_L control = { "Freq" = 700.0  "Q" = 0.7071 } }
                    { type = builtin label = bq_lowpass name = cross_R control = { "Freq" = 700.0  "Q" = 0.7071 } }

                    # 6. Mezcladores Maestros Lossless (Mid/Side Soundstage + Crossfeed + Techo Anti-Clipping -0.14 dBFS)
                    # Ganancia directa calibrada: 0.86
                    # Cancelación lateral Mid/Side: -0.08
                    # Compensación binaural contralateral: +0.08
                    { type = builtin label = mixer name = mixL control = { "Gain 1" = 0.86 "Gain 2" = -0.08 "Gain 3" = 0.08 } }
                    { type = builtin label = mixer name = mixR control = { "Gain 1" = 0.86 "Gain 2" = -0.08 "Gain 3" = 0.08 } }
                ]
                links = [
                    # Enrutamiento de entrada hacia filtro subsónico
                    { output = "inL:Out"       input = "hp_L:In" }
                    { output = "inR:Out"       input = "hp_R:In" }

                    # Cadena EQ Izquierda
                    { output = "hp_L:Out"      input = "eq_L_1:In" }
                    { output = "eq_L_1:Out"    input = "eq_L_2:In" }
                    { output = "eq_L_2:Out"    input = "eq_L_3:In" }
                    { output = "eq_L_3:Out"    input = "eq_L_4:In" }
                    { output = "eq_L_4:Out"    input = "eq_L_5:In" }
                    { output = "eq_L_5:Out"    input = "eq_L_6:In" }
                    { output = "eq_L_6:Out"    input = "eq_L_7:In" }
                    { output = "eq_L_7:Out"    input = "eq_L_8:In" }
                    { output = "eq_L_8:Out"    input = "eq_L_9:In" }
                    { output = "eq_L_9:Out"    input = "eq_L_10:In" }

                    # Cadena EQ Derecha
                    { output = "hp_R:Out"      input = "eq_R_1:In" }
                    { output = "eq_R_1:Out"    input = "eq_R_2:In" }
                    { output = "eq_R_2:Out"    input = "eq_R_3:In" }
                    { output = "eq_R_3:Out"    input = "eq_R_4:In" }
                    { output = "eq_R_4:Out"    input = "eq_R_5:In" }
                    { output = "eq_R_5:Out"    input = "eq_R_6:In" }
                    { output = "eq_R_6:Out"    input = "eq_R_7:In" }
                    { output = "eq_R_7:Out"    input = "eq_R_8:In" }
                    { output = "eq_R_8:Out"    input = "eq_R_9:In" }
                    { output = "eq_R_9:Out"    input = "eq_R_10:In" }

                    # Enrutamiento hacia Crossfeed
                    { output = "eq_L_10:Out"   input = "cross_L:In" }
                    { output = "eq_R_10:Out"   input = "cross_R:In" }

                    # Mezcla Izquierda: Directo (0.86) + Invertido R (-0.08) + Crossfeed R (+0.08)
                    { output = "eq_L_10:Out"   input = "mixL:In 1" }
                    { output = "eq_R_10:Out"   input = "mixL:In 2" }
                    { output = "cross_R:Out"   input = "mixL:In 3" }

                    # Mezcla Derecha: Directo (0.86) + Invertido L (-0.08) + Crossfeed L (+0.08)
                    { output = "eq_R_10:Out"   input = "mixR:In 1" }
                    { output = "eq_L_10:Out"   input = "mixR:In 2" }
                    { output = "cross_L:Out"   input = "mixR:In 3" }
                ]
                inputs  = [ "inL:In" "inR:In" ]
                outputs = [ "mixL:Out" "mixR:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "hifi_loss_sink"
                media.class      = Audio/Sink
                priority.session = 1500
                priority.driver  = 1500
            }
            playback.props = {
                node.name        = "hifi_loss_playback"
                node.passive     = true
            }
        }
    }
]
