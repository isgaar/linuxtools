# ==============================================================================
# Perfil Maestro PipeWire: "hifi-loss" (Hi-Fi Lossless Studio Master)
# ==============================================================================
# Arquitectura acústica audiófila pura (Bit-Perfect & Zero-Clipping):
#  1. Cero Distorsión y Cero Clipping: Margen de seguridad estricto de -0.14 dBFS
#     con pre-atenuación calibrada para absorber los picos de la ecualización.
#     Erradica por completo el recorte digital (hard-clipping) en archivos FLAC/Hi-Res.
#  2. Cero Cancelación de Fase (Pureza 100% Estéreo): Aislamiento total de canales L/R
#     sin filtros cruzados destructivos, preservando la coherencia y profundidad
#     original del master de estudio sin artefactos de compresión tipo MP3.
#  3. Filtro Pasa-Altos Subsónico Butterworth 25 Hz (Q=0.7071): Protege los
#     transductores de la sobre-excursión mecánica e intermodulación por subgraves inaudibles.
#  4. Curva de Referencia Audiófila Harman/Mastering de 10 Bandas: Graves profundos y
#     controlados, medios neutros y aire cristalino en agudos sin sibilancia.
# ==============================================================================

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Hi-Fi Lossless Master (hifi-loss)"
            media.name       = "Hi-Fi Lossless Master (hifi-loss)"
            filter.graph = {
                nodes = [
                    # 1. Duplicadores lineales directos de entrada L/R
                    { type = builtin label = copy name = inL }
                    { type = builtin label = copy name = inR }

                    # 2. Filtro Pasa-Altos Subsónico Butterworth 25 Hz (Protección acústica contra sobre-excursión e IMD)
                    { type = builtin label = bq_highpass name = hp_L control = { "Freq" = 25.0 "Q" = 0.7071 } }
                    { type = builtin label = bq_highpass name = hp_R control = { "Freq" = 25.0 "Q" = 0.7071 } }

                    # 3. Cadena de Ecualización Audiófila Suave (Canal Izquierdo - 10 Bandas)
                    { type = builtin label = bq_peaking name = eq_L_1  control = { "Freq" = 32.0   "Q" = 0.8  "Gain" = 2.2 } }
                    { type = builtin label = bq_peaking name = eq_L_2  control = { "Freq" = 64.0   "Q" = 0.9  "Gain" = 1.8 } }
                    { type = builtin label = bq_peaking name = eq_L_3  control = { "Freq" = 125.0  "Q" = 1.0  "Gain" = 0.8 } }
                    { type = builtin label = bq_peaking name = eq_L_4  control = { "Freq" = 250.0  "Q" = 1.2  "Gain" = -0.8 } }
                    { type = builtin label = bq_peaking name = eq_L_5  control = { "Freq" = 500.0  "Q" = 1.2  "Gain" = 0.0 } }
                    { type = builtin label = bq_peaking name = eq_L_6  control = { "Freq" = 1000.0 "Q" = 1.2  "Gain" = 0.0 } }
                    { type = builtin label = bq_peaking name = eq_L_7  control = { "Freq" = 2000.0 "Q" = 1.1  "Gain" = 0.8 } }
                    { type = builtin label = bq_peaking name = eq_L_8  control = { "Freq" = 4000.0 "Q" = 1.0  "Gain" = 1.2 } }
                    { type = builtin label = bq_peaking name = eq_L_9  control = { "Freq" = 8000.0 "Q" = 0.9  "Gain" = 1.6 } }
                    { type = builtin label = bq_peaking name = eq_L_10 control = { "Freq" = 14000.0 "Q" = 0.7  "Gain" = 2.0 } }

                    # 4. Cadena de Ecualización Audiófila Suave (Canal Derecho - 10 Bandas)
                    { type = builtin label = bq_peaking name = eq_R_1  control = { "Freq" = 32.0   "Q" = 0.8  "Gain" = 2.2 } }
                    { type = builtin label = bq_peaking name = eq_R_2  control = { "Freq" = 64.0   "Q" = 0.9  "Gain" = 1.8 } }
                    { type = builtin label = bq_peaking name = eq_R_3  control = { "Freq" = 125.0  "Q" = 1.0  "Gain" = 0.8 } }
                    { type = builtin label = bq_peaking name = eq_R_4  control = { "Freq" = 250.0  "Q" = 1.2  "Gain" = -0.8 } }
                    { type = builtin label = bq_peaking name = eq_R_5  control = { "Freq" = 500.0  "Q" = 1.2  "Gain" = 0.0 } }
                    { type = builtin label = bq_peaking name = eq_R_6  control = { "Freq" = 1000.0 "Q" = 1.2  "Gain" = 0.0 } }
                    { type = builtin label = bq_peaking name = eq_R_7  control = { "Freq" = 2000.0 "Q" = 1.1  "Gain" = 0.8 } }
                    { type = builtin label = bq_peaking name = eq_R_8  control = { "Freq" = 4000.0 "Q" = 1.0  "Gain" = 1.2 } }
                    { type = builtin label = bq_peaking name = eq_R_9  control = { "Freq" = 8000.0 "Q" = 0.9  "Gain" = 1.6 } }
                    { type = builtin label = bq_peaking name = eq_R_10 control = { "Freq" = 14000.0 "Q" = 0.7  "Gain" = 2.0 } }

                    # 5. Salida Maestra con Margen Anti-Clipping True-Peak (-0.14 dBFS absoluto)
                    # Ganancia lineal 0.776 (-2.2 dBFS) absorbe con precisión el boost de la ecualización,
                    # garantizando que la salida analógica del DAC jamás sobrepase 0 dBFS con archivos FLAC.
                    { type = builtin label = linear name = outL control = { "Mult" = 0.776 } }
                    { type = builtin label = linear name = outR control = { "Mult" = 0.776 } }
                ]
                links = [
                    # Entrada -> Filtro Pasa-Altos 25 Hz
                    { output = "inL:Out"       input = "hp_L:In" }
                    { output = "inR:Out"       input = "hp_R:In" }

                    # Cadena EQ Izquierda (Coherencia de fase lineal)
                    { output = "hp_L:Out"      input = "eq_L_1:In" }
                    { output = "eq_L_1:Out"    input = "eq_L_2:In" }
                    { output = "eq_L_2:Out"    input = "eq_L_3:In" }
                    { output = "eq_L_3:Out"    input = "eq_L_4:In" }
                    { output = "eq_L_4:Out"    input = "eq_L_5:In" }
                    { output = "eq_L_5:Out"    input = "eq_L_6:In" }
                    { output = "eq_L_6:Out"    input = "eq_L_7:In" }
                    { output = "eq_L_7:Out"    input = "eq_L_8:In" }
                    { output = "eq_L_8:Out"    input = "eq_L_9:In" }
                    { output = "eq_L_9:Out"    input = "eq_L_10:In" }
                    { output = "eq_L_10:Out"   input = "outL:In" }

                    # Cadena EQ Derecha (Coherencia de fase lineal)
                    { output = "hp_R:Out"      input = "eq_R_1:In" }
                    { output = "eq_R_1:Out"    input = "eq_R_2:In" }
                    { output = "eq_R_2:Out"    input = "eq_R_3:In" }
                    { output = "eq_R_3:Out"    input = "eq_R_4:In" }
                    { output = "eq_R_4:Out"    input = "eq_R_5:In" }
                    { output = "eq_R_5:Out"    input = "eq_R_6:In" }
                    { output = "eq_R_6:Out"    input = "eq_R_7:In" }
                    { output = "eq_R_7:Out"    input = "eq_R_8:In" }
                    { output = "eq_R_8:Out"    input = "eq_R_9:In" }
                    { output = "eq_R_9:Out"    input = "eq_R_10:In" }
                    { output = "eq_R_10:Out"   input = "outR:In" }
                ]
                inputs  = [ "inL:In" "inR:In" ]
                outputs = [ "outL:Out" "outR:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "hifi_loss_sink"
                media.class      = Audio/Sink
                priority.session = 1500
                priority.driver  = 1500
            }
            playback.props = {
                node.name        = "hifi_loss_playback"
                node.passive     = true
            }
        }
    }
]
